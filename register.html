<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management System - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>College Management System</h1>
            <h2>Register</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <div class="form-group">
                    <label for="registerUserType">I am a</label>
                    <select id="registerUserType" required>
                        <option value="">Select...</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div class="form-group" id="studentIdGroup" style="display: none;">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId">
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <p class="auth-link">Already have an account? <a href="index.html">Login here</a></p>
            </form>
            <div id="registerError" class="error-message"></div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
